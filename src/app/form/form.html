<form [formGroup]="bookListForm">
  <p-floatlabel variant="on">
    <input type="text" id="name" formControlName="name" pInputText autocomplete="off" />
    <label for="name">Name</label>
  </p-floatlabel>
  <p-floatlabel variant="on">
    <textarea
      pTextarea
      id="description"
      formControlName="description"
      rows="5"
      cols="30"
      style="resize: none"
      class="h-full"
    ></textarea>
    <label for="description">On Label</label>
  </p-floatlabel>

  <p-select
    [filter]="true"
    [showClear]="true"
    [options]="booksList()"
    [loading]="booksLoading()"
  ></p-select>
</form>
<!-- (onChange)="addBookToList($event)" -->

<p-button label="Add new" (onClick)="addNewBook()" />

@for (book of addedBooks(); track $index) {
  <p>{{ book }}</p>
}
