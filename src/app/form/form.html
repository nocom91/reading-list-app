<div class="w-full flex flex-col gap-8 items-center">
  <h2 class="text-gray-800 text-2xl">Create a new reading list</h2>
  <form [formGroup]="bookListForm"
        class="flex flex-col gap-4 w-1/3">
    <p-floatlabel variant="on"
                  class="w-full">
      <input type="text"
             id="name"
             formControlName="name"
             pInputText
             autocomplete="off"
             class="w-full" />
      <label for="name">Name</label>
    </p-floatlabel>
    <p-floatlabel variant="on">
      <textarea pTextarea
                id="description"
                formControlName="description"
                rows="5"
                cols="30"
                style="resize: none"
                class="w-full"></textarea>
      <label for="description">Description</label>
    </p-floatlabel>

    <p-select [filter]="true"
              [showClear]="true"
              [options]="booksList()"
              [loading]="booksLoading()"
              placeholder="Select a book"
              (onChange)="onBookSelected($event)">
      <ng-template #selectedItem
                   let-selectedBook>
        <span class="text-gray-900  text-base">{{ selectedBook.name }}</span>
      </ng-template>
      <ng-template #item
                   let-book>
        <div class="flex flex-col gap-1 justify-start">
          <span class="text-gray-900 text-lg">
            {{ book.name.length > 80 ? book.name.slice(0, 79) + '...' : book.name }}
          </span>
          <span class="text-gray-700 text-base">
            {{ book.author }}
          </span>
        </div>
      </ng-template>
    </p-select>
  </form>

  <p-button label="Add new"
            (onClick)="addNewBook()" />
</div>
