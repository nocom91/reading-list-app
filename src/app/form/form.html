<div class="w-full flex flex-col gap-8 items-center">
  <h2 class="text-gray-800 text-2xl">Create a new reading list</h2>
  <form [formGroup]="bookListForm"
        class="flex flex-col gap-4 w-1/3">
    <p-floatlabel variant="on"
                  class="w-full">
      <input type="text"
             id="name"
             formControlName="name"
             pInputText
             autocomplete="off"
             class="w-full" />
      <label for="name">Name</label>
    </p-floatlabel>
    <p-floatlabel variant="on">
      <textarea pTextarea
                id="description"
                formControlName="description"
                rows="5"
                cols="30"
                style="resize: none"
                class="w-full"></textarea>
      <label for="description">Description</label>
    </p-floatlabel>

    <p-select [filter]="true"
              [showClear]="true"
              [options]="booksList()"
              [loading]="booksLoading()"
              placeholder="Select a book"></p-select>
  </form>

  <p-button label="Add new"
            (onClick)="addNewBook()" />
</div>
